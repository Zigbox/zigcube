<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Zigcube console</title>
<!-- Set by a published copy so it opens on the simulation (sim=c0) or the C1 mock (mock=c1). The
     server build leaves these empty. ?sim=c0 or ?mock=c1 in the URL overrides them. -->
<meta name="zcube-sim" content="">
<meta name="zcube-mock" content="">
<meta name="zcube-mock-at" content="0">
<link rel="stylesheet" href="css/console.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' rx='2' transform='rotate(45 16 16)' fill='none' stroke='%232156b8' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span>Zigcube</a>
  <span class="env" id="env-tag">console</span>
  <span class="grow"></span>
  <button type="button" id="conn-btn" class="conn-btn" aria-expanded="false" aria-controls="conn-log" aria-label="Connection status">
    <span id="conn" class="conn" data-conn="connecting"><span class="c-glyph" aria-hidden="true">◌</span> <span class="c-label">Connecting</span> <span class="c-detail"></span></span>
  </button>
  <button type="button" id="theme" class="ghost" aria-label="Switch theme">Theme: system</button>
</header>
<div id="conn-log" class="popover" hidden role="region" aria-label="Connection log"></div>
<nav class="side" aria-label="Main">
  <a href="#/" data-nav="overview">Overview</a>
  <a href="#/services" data-nav="services">Services</a>
  <a href="#/replicas" data-nav="replicas">Replicas</a>
  <a href="#/nodes" data-nav="nodes">Nodes</a>
  <a href="#/why" data-nav="why">Why</a>
  <a href="#/decisions" data-nav="decisions">Decisions</a>
  <a href="#/codes" data-nav="codes">Codes</a>
  <span class="nav-hint">Press <kbd>?</kbd> for shortcuts</span>
</nav>
<div id="banner" class="banner" hidden role="status"></div>
<main id="main" tabindex="-1"><p class="muted pad">Loading…</p></main>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<div id="help" class="popover help" hidden role="dialog" aria-label="Keyboard shortcuts">
  <h2>Keyboard shortcuts</h2>
  <dl><dt><kbd>g</kbd> <kbd>o</kbd></dt><dd>Overview</dd><dt><kbd>g</kbd> <kbd>s</kbd></dt><dd>Services</dd><dt><kbd>g</kbd> <kbd>r</kbd></dt><dd>Replicas</dd><dt><kbd>g</kbd> <kbd>n</kbd></dt><dd>Nodes</dd><dt><kbd>g</kbd> <kbd>d</kbd></dt><dd>Decisions</dd><dt><kbd>g</kbd> <kbd>w</kbd></dt><dd>Why</dd><dt><kbd>g</kbd> <kbd>c</kbd></dt><dd>Codes</dd><dt><kbd>/</kbd></dt><dd>Focus the filter</dd><dt><kbd>Esc</kbd></dt><dd>Close this</dd></dl>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
