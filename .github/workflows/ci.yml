      # The guest image is a download of about 600 MB; its pin is in the Zigbox package, so the
      # key is the pinned package (build.zig.zon).
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/vm/*.img
          key: zigbox-smoke-image-${{ hashFiles('build.zig.zon') }}
      # ReleaseSafe: the harness serves files of at most 8 MiB, which a Debug build exceeds.
      - name: demo-b3
        shell: bash
        run: |
          zig build demo-b3 -Doptimize=ReleaseSafe -Dtranscript=demo-b3-transcript.txt \
            --summary all 2>&1 | tee demo-b3.txt
      - name: Keep the output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-b3-output
          path: |
            demo-b3.txt
            demo-b3-transcript.txt
          if-no-files-found: warn

  # The Zigcube packages (docs/briefs/packaging.md): build the .deb and .rpm files with the
  # tool's fixed test key (never a release key), check the written tree, then install them in an
  # Ubuntu and a Fedora container (installed with the distro's own tools, on the runner's docker):
  # `zcube version`, each server flavour starting and refusing its wrong store, a remove, an
  # upgrade that keeps an edited server.zon. The binaries are the runner's, built on glibc 2.39;
  # the release job builds them in a RHEL 9 container so that they run on older systems.
  packages:
    name: packages (deb and rpm, four distros, throwaway keys)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: SQLite and libpq development files
        uses: ./.github/actions/install-apt
        with:
          packages: libsqlite3-dev libpq-dev
      # zcube and zcube-agent here, both servers in Rocky Linux 9 (the RHEL 9 build).
      - name: Build the executables
        run: .github/build-release-bin.sh
      - name: Write and check the packages (this architecture)
        run: zig build packages-check -Dtest-key=true -Dpackage-arch=x86_64 --summary all
      - name: Write the release assets (tarball, SBOM, SHA256SUMS)
        run: zig build release-assets -Dno-packages -Dpackage-arch=x86_64
      # Debian 12, Ubuntu 24.04, Fedora 42 and Rocky Linux 9: signed repositories over HTTP,
      # zigbox-dev by name with zigbox from zigbox.org, an upgrade, a flavour swap, a remove.
      - name: Install, run, upgrade and remove them in four distributions
        run: .github/packages-install.sh
      - name: The release signing path with a generated throwaway gpg key
        run: .github/release-sign-test-container.sh

  # The macOS zcube (docs/briefs/packaging.md, slice 2), ported from Zigbox's release `mac-test`:
  # `zig build mac-release` over both slices, signed with a throwaway self-signed identity in a
  # temporary keychain (hardened runtime, no entitlement, no notarization, no upload), the zip
  # checked as a user gets it, `zcube version` and `zcube help`, `zcube local` refused with
  # ZC-E0122, and the unit tests that build on macOS. No secret is used: the keychain's and the
  # wrapping password are random, made here and gone with the runner.
  mac-test:
    name: mac-test (universal zcube, throwaway identity)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mac_test == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
    steps:
      # The runner context is not available in a job's `env:`, so the paths are set here.
      - name: Paths of the temporary keychain and its work directory
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/zcube-mac-test.keychain-db" >> "$GITHUB_ENV"
          echo "SECRETS_DIR=$RUNNER_TEMP/zcube-mac-test-secrets" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-zig-macos
      - name: The unit tests that build on macOS
        run: zig build test-macos --summary all
      - name: Temporary keychain with a throwaway self-signed identity
        run: |
          umask 077
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          mkdir "$SECRETS_DIR"
          KEYCHAIN_PASSWORD=$(/usr/bin/openssl rand -hex 24)
          WRAP_PASSWORD=$(/usr/bin/openssl rand -hex 24)
          export WRAP_PASSWORD
          cat > "$SECRETS_DIR/openssl.cnf" <<'CNF'
          [req]
          distinguished_name = dn
          prompt = no
          x509_extensions = ext
          [dn]
          CN = zcube-mac-test
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 -config "$SECRETS_DIR/openssl.cnf" \
            -keyout "$SECRETS_DIR/key.pem" -out "$SECRETS_DIR/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SECRETS_DIR/key.pem" -in "$SECRETS_DIR/cert.pem" \
            -passout env:WRAP_PASSWORD -out "$SECRETS_DIR/wrapped.p12"
          # `security` takes these two throwaway passwords on its command line only (as in
          # Zigbox's mac-test); they lock a keychain that lives for this job and holds nothing else.
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security set-keychain-settings -t 3600 "$KEYCHAIN"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security import "$SECRETS_DIR/wrapped.p12" -k "$KEYCHAIN" -P "$WRAP_PASSWORD" -x -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign refuses an identity whose certificate is not trusted for code signing, so the
          # throwaway certificate is trusted in the admin domain (the user domain would wait for a
          # password prompt); a prompt fails the step after a minute instead of hanging it.
          /usr/bin/perl -e 'alarm 60; exec @ARGV' /usr/bin/sudo -n /usr/bin/security \
            add-trusted-cert -d -r trustRoot -p codeSign -k "$KEYCHAIN" "$SECRETS_DIR/cert.pem"
          /usr/bin/security find-identity -p codesigning "$KEYCHAIN"
          # codesign finds an untrusted self-signed identity by its certificate hash (public data).
          fingerprint=$(/usr/bin/openssl x509 -in "$SECRETS_DIR/cert.pem" -noout -fingerprint -sha1)
          echo "TEST_IDENTITY=$(echo "${fingerprint#*=}" | /usr/bin/tr -d ':')" >> "$GITHUB_ENV"
          /bin/rm -rf "$SECRETS_DIR"
      - name: Build the universal zip and sign it (no notarization, no upload)
        run: |
          # codesign finds the identity only when its keychain is on the search list. Saved to a
          # temp file and moved into place, so the cleanup never restores an empty list.
          /usr/bin/security list-keychains -d user | /usr/bin/sed 's/^ *"\(.*\)"$/\1/' > "$RUNNER_TEMP/keychain-list.tmp"
          /bin/mv "$RUNNER_TEMP/keychain-list.tmp" "$RUNNER_TEMP/keychain-list"
          existing=()
          while IFS= read -r line; do existing+=("$line"); done < "$RUNNER_TEMP/keychain-list"
          /usr/bin/security list-keychains -d user -s "$KEYCHAIN" ${existing[@]+"${existing[@]}"}
          zig build mac-release -Dsign-identity="$TEST_IDENTITY" -Dkeychain="$KEYCHAIN"
      - name: The zip is the one that was hashed, and the formula names it
        id: zip
        run: |
          cd zig-out/mac-release
          /usr/bin/shasum -a 256 -c zcube-*-macos-universal.zip.sha256
          version=$(sed -n 's/^ *\.version = "\([^"]*\)",.*/\1/p' ../../build.zig.zon | head -n 1)
          sum=$(cut -d ' ' -f 1 "zcube-$version-macos-universal.zip.sha256")
          grep -q "sha256 \"$sum\"" zigcube.rb
          grep -q "version \"$version\"" zigcube.rb
          if grep -q '@[A-Z0-9]*@' zigcube.rb; then echo "mac-test: zigcube.rb keeps a placeholder" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/mac-check-zip
        with:
          zip: zig-out/mac-release/zcube-${{ steps.zip.outputs.version }}-macos-universal.zip
          version: ${{ steps.zip.outputs.version }}
          gatekeeper: 'false'
      - name: zcube version, zcube help, and zcube local refused with ZC-E0122
        run: |
          dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/zcube-run.XXXXXX")
          /usr/bin/ditto -x -k zig-out/mac-release/zcube-${{ steps.zip.outputs.version }}-macos-universal.zip "$dir"
          "$dir/zcube" version
          "$dir/zcube" help | tee "$dir/help.txt"
          grep -q "local up" "$dir/help.txt"
          status=0
          ZCUBE_LOCAL_DIR="$dir/local" "$dir/zcube" local up 2> "$dir/local.txt" || status=$?
          cat "$dir/local.txt"
          if [ "$status" -ne 2 ]; then echo "mac-test: zcube local up exited $status, not 2" >&2; exit 1; fi
          grep -q "ZC-E0122" "$dir/local.txt"
          grep -q "zcube local needs Linux" "$dir/local.txt"
          if [ -e "$dir/local" ]; then echo "mac-test: zcube local up made its directory" >&2; exit 1; fi
          /bin/rm -rf "$dir"
      - name: Delete the keychain and everything this job wrote under the runner's temp
        if: ${{ always() }}
        run: |
          # Puts back the search list the build step found (nothing to do if it never got that far).
          if [ -f "$RUNNER_TEMP/keychain-list" ]; then
            saved=()
            while IFS= read -r line; do saved+=("$line"); done < "$RUNNER_TEMP/keychain-list"
            /usr/bin/security list-keychains -d user -s ${saved[@]+"${saved[@]}"} || true
          fi
          /usr/bin/security delete-keychain "$KEYCHAIN" || true
          /bin/rm -rf "$KEYCHAIN" "$RUNNER_TEMP/keychain-list" "$RUNNER_TEMP/keychain-list.tmp" "$SECRETS_DIR" "$RUNNER_TEMP"/zig-aarch64-macos-* "$RUNNER_TEMP"/zcube-run.*

  # Stock servers (openssl s_server, a JDK 21 SSLServerSocket) against the mTLS client. Test-only
  # tools: docs/decisions/2026-11-05-interop-tools-are-test-only.md.
  mtls-interop:
    name: mtls-interop (openssl, JDK 21)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mtls_interop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: mtls-interop
        shell: bash
        run: |
          # The runner image ships JDK 21 and sets JAVA_HOME_21_X64; the harness fails on another.
          : "${JAVA_HOME_21_X64:?the runner image has no JDK 21}"
          export ZCUBE_JAVA_HOME="$JAVA_HOME_21_X64"
          openssl version
          "$ZCUBE_JAVA_HOME/bin/java" -version
          zig build mtls-interop --summary all 2>&1 | tee mtls-interop.txt
      - name: Keep the output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mtls-interop-output
          path: mtls-interop.txt
          if-no-files-found: warn
