# Zigcube CI. Every action is pinned to a full commit SHA (the tag is in the comment); Zig is
# installed from a verified tarball (.github/actions/setup-zig). The other shell lines are the
# changes job's classifier (git diff over the changed paths, see that job), the apt-get line that
# installs the SQLite and libpq development files the tests link, and the docker line of the
# Postgres demo job that names its service container. The wasm job uses the Node that the runner
# image carries.
name: ci

# CI runs on pull requests and on main only: a pushed branch without a PR runs nothing, so
# Actions time is spent once per change. Open a PR when a change needs CI. A newer push to the
# same PR cancels the run it supersedes; runs on main are never cancelled.
# A change that touches only documentation (the changes job says what counts) skips every other
# job: they report as skipped, which required checks count as passing. Anything else runs them all.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether the jobs below run. A change is documentation only when every changed path is
  # a file ending in `.md` (except under web/ or src/), or lies under site/ (except site/errors/,
  # which CI generates and checks). An empty diff, a path that is neither, or a diff that cannot be
  # listed means code, so everything runs. Renames are listed as a delete and an add (--no-renames),
  # so the old path is judged too. A `.zig`, `.zon` or `.sh` file is code wherever it is, because
  # `zig fmt --check .` and tidy read every one in the tree. The jobs below run when `code` is
  # true. If this job itself fails, they still run (the output defaults to true), so a broken
  # classifier cannot skip the checks; `!cancelled()` rather than `always()`, so a run superseded
  # by a newer push is still cancelled.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the change (documentation only or code)
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          is_doc() {
            case "$1" in
              web/* | src/* | site/errors/*) return 1 ;;
              *.zig | *.zon | *.sh) return 1 ;;
              site/*) return 0 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          files=""
          listed=no
          if [ "${EVENT}" = pull_request ]; then
            if files="$(git diff --no-renames --name-only "${BASE}...${HEAD}")"; then listed=yes; fi
          elif [ "${EVENT}" = push ] && [ "${BEFORE}" != 0000000000000000000000000000000000000000 ]; then
            if files="$(git diff --no-renames --name-only "${BEFORE}" "${AFTER}")"; then listed=yes; fi
          fi
          code=true
          why="the changed files could not be listed"
          if [ "${listed}" = yes ] && [ -z "${files}" ]; then
            why="the diff is empty"
          elif [ "${listed}" = yes ]; then
            code=false
            why="every changed path is documentation"
            while IFS= read -r f; do
              if ! is_doc "${f}"; then
                code=true
                why="${f} is not documentation"
                break
              fi
            done <<< "${files}"
          fi
          echo "Changed files:"
          if [ -n "${files}" ]; then
            while IFS= read -r f; do echo "  ${f}"; done <<< "${files}"
          fi
          if [ "${code}" = true ]; then
            echo "Verdict: not documentation only (${why}); every job runs"
          else
            echo "Verdict: documentation only; the other jobs are skipped"
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  check:
    name: format, build, test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      # The SHA is the one Zigbox's CI pins for actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Formatting
        run: zig fmt --check .
      - name: Tidy (style rules)
        run: zig build tidy
      # Before the build: zcube-server links both client libraries.
      - name: SQLite and libpq development files
        run: sudo apt-get install -y --no-install-recommends libsqlite3-dev libpq-dev
      - name: Build the three executables
        run: zig build
      - name: Unit and snapshot tests
        run: zig build test --summary all
      # The golden files of every ZC- code are checked by the tests above (and embedded at compile
      # time); the pages that the `docs` link of a diagnostic points at are checked here.
      - name: Error pages are up to date
        run: zig build errors-site-check
      # The suite picks a random seed per run; a failure prints it, and -Dseed=N replays it.
      - name: Store conformance (memory)
        run: zig build test-store -Dbackend=memory --summary all
      - name: Store conformance (sqlite)
        run: zig build test-store -Dbackend=sqlite --summary all
      # Not demo-c0: the server and one agent as real processes, with real containers (kill -9, an
      # agent restart, a server restart, an unknown digest). It cleans up what it starts.
      - name: Agent smoke (real processes)
        run: zig build agent-smoke --summary all

  # The same conformance suite against a real Postgres 16, the server a deployment would run.
  # The image is pinned by digest (postgres:16.15, resolved from Docker Hub on 2026-10-26), so a
  # moving tag cannot change what CI tests. The suite makes its own schema per test in the
  # database below and drops it, and it draws a new seed each run, so a few runs in a row are
  # a few draws of the racing-writer tests.
  store-postgres:
    name: store conformance (postgres)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: zcube
          POSTGRES_PASSWORD: zcube
          POSTGRES_DB: zcube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zcube -d zcube"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ZCUBE_TEST_POSTGRES: host=127.0.0.1 port=5432 user=zcube password=zcube dbname=zcube
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: SQLite and libpq development files
        run: sudo apt-get install -y --no-install-recommends libsqlite3-dev libpq-dev
      - name: Store conformance (postgres), three draws
        run: |
          for run in 1 2 3; do
            zig build test-store -Dbackend=postgres --summary all
          done

  # Slice 10c: client threads against Postgres through the fault proxy, every call recorded and
  # checked, and the conformance suite run through the proxy (latency, bandwidth, stalls). The
  # image is the one of store-postgres. The settings are in libpq keyword form because the runner
  # adds `host=` and `port=` of the proxy to them. Each run draws a new seed (printed first).
  store-faults:
    name: store faults (postgres, sqlite)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: zcube
          POSTGRES_PASSWORD: zcube
          POSTGRES_DB: zcube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zcube -d zcube"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ZCUBE_TEST_POSTGRES: host=127.0.0.1 port=5432 user=zcube password=zcube dbname=zcube
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: SQLite and libpq development files
        run: sudo apt-get install -y --no-install-recommends libsqlite3-dev libpq-dev
      - name: Store faults (postgres)
        run: zig build test-store-faults -Dbackend=postgres -Dpostgres="${ZCUBE_TEST_POSTGRES}" --summary all
      - name: Store faults (sqlite, history checker only)
        run: zig build test-store-faults -Dbackend=sqlite --summary all

  # HANDOFF's C0 demo, run for real (docs/demos/c0.md): zcube-server, one zcube-agent with
  # FakeRuntime and the zcube command as real processes, on each backend. Each prints a transcript
  # (also kept as an artifact); the demo fails on the first assertion that does not hold, and kills
  # everything it started. Two jobs, one per backend, so a failure names its backend.
  demo-c0-sqlite:
    name: demo-c0 (sqlite)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: SQLite and libpq development files
        run: sudo apt-get install -y --no-install-recommends libsqlite3-dev libpq-dev
      - name: demo-c0 on SQLite
        run: zig build demo-c0 -Dbackend=sqlite -Dtranscript=demo-c0-sqlite.txt --summary all
      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-c0-sqlite-transcript
          path: demo-c0-sqlite.txt
          if-no-files-found: warn

  # The same image, by digest, as store-postgres. The demo stops the database mid-run: the service
  # container is stopped with `docker stop` and started again with `docker start`, which keeps its
  # data and its published port. The container is named once, before the demo runs.
  demo-c0-postgres:
    name: demo-c0 (postgres)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: zcube
          POSTGRES_PASSWORD: zcube
          POSTGRES_DB: zcube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zcube -d zcube"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ZCUBE_TEST_POSTGRES: host=127.0.0.1 port=5432 user=zcube password=zcube dbname=zcube
      ZCUBE_DEMO_PG_STOP: docker stop "$PG_CONTAINER"
      ZCUBE_DEMO_PG_START: docker start "$PG_CONTAINER"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: SQLite and libpq development files
        run: sudo apt-get install -y --no-install-recommends libsqlite3-dev libpq-dev
      - name: Name the Postgres container
        run: |
          container="$(docker ps --quiet --filter publish=5432)"
          test -n "${container}"
          echo "PG_CONTAINER=${container}" >> "${GITHUB_ENV}"
      - name: demo-c0 on Postgres
        run: zig build demo-c0 -Dbackend=postgres -Dtranscript=demo-c0-postgres.txt --summary all
      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-c0-postgres-transcript
          path: demo-c0-postgres.txt
          if-no-files-found: warn

  # The control-plane core must compile for wasm32-freestanding (docs/wasm.md): no libc, no OS,
  # no threads, no std.Io. Node is the one WebAssembly runtime on the runner (its version is
  # printed below); tools/wasm_check.mjs says why a JavaScript runner is acceptable. The core is
  # also built and run in ReleaseSafe, the mode Zigcube ships, where assertions stay on.
  wasm:
    name: core on wasm32
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Node version
        run: node --version
      - name: Core library (wasm32-freestanding), run in Node
        run: zig build wasm-check --summary all
      - name: Core library, ReleaseSafe
        run: zig build wasm-check -Doptimize=ReleaseSafe --summary all
      - name: Core unit tests (wasm32-wasi), run in Node
        run: zig build wasm-test --summary all
      # The console's browser module (ReleaseSafe, whatever -Doptimize says): it must build, import
      # exactly env.zc_panic, answer GET /v1/status and run the scenario, under each V8 compiler.
      - name: Console module (browser), checked in Node
        run: zig build console-wasm --summary all
      # A simulation, not demo-c0 (docs/core.md). The same seed runs natively and in WASM and the
      # reports must agree byte for byte. Seed 1 always, and one seed per CI run, printed here.
      - name: C0 simulation, native and WASM, seed 1
        run: zig build sim-c0 --summary all
      - name: C0 simulation, native and WASM, seed of this run
        run: |
          echo "seed ${{ github.run_id }}"
          zig build sim-c0 -Dseed=${{ github.run_id }} -Dops=200 -Doptimize=ReleaseSafe --summary all
