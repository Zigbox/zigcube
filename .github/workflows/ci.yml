  # The Jepsen battery's tarball and its Postgres recipe (docs/jepsen.md,
  # docs/decisions/2026-11-17-jepsen-j2-dist-and-recipe.md). `zig build dist` builds the tarball
  # the battery deploys; it is checked against its .sha256 and unpacked, its recipe compared with
  # ops/jepsen/, and ops/jepsen/test-postgres.sh runs postgres.sh (a primary and a synchronous
  # standby on two ports, a crash, a promotion, a rejoin) and fault.sh's Postgres pause as root,
  # then test-recipe.sh against that pair with the tarball's executables. A few minutes, most of
  # it the ReleaseSafe build.
  jepsen:
    name: jepsen recipe (dist, postgres.sh)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.jepsen == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: jepsen
      - name: SQLite and libpq development files
        uses: ./.github/actions/install-apt
        with:
          packages: libsqlite3-dev libpq-dev
      - name: Postgres 16 programs
        id: pg16
        run: |
          if [ -x /usr/lib/postgresql/16/bin/pg_ctl ]; then echo need=false >> "${GITHUB_OUTPUT}"; else echo need=true >> "${GITHUB_OUTPUT}"; fi
      - name: Install postgresql-16
        if: ${{ steps.pg16.outputs.need == 'true' }}
        uses: ./.github/actions/install-apt
        with:
          packages: postgresql-16
      - name: Drop the package's own cluster
        if: ${{ steps.pg16.outputs.need == 'true' }}
        run: sudo pg_dropcluster --stop 16 main || true
      - name: Build the tarball
        run: zig build dist --summary all
      - name: Check and unpack the tarball
        shell: bash
        run: |
          (cd zig-out/dist && sha256sum -c ./*.sha256)
          mkdir -p "${RUNNER_TEMP}/dist"
          tar -xzf zig-out/dist/*.tar.gz -C "${RUNNER_TEMP}/dist"
          top=$(echo "${RUNNER_TEMP}"/dist/zigcube-*)
          for f in "${top}"/share/jepsen/*; do cmp "${f}" "ops/jepsen/$(basename "${f}")"; done
          echo "TOP=${top}" >> "${GITHUB_ENV}"
      - name: postgres.sh and the recipe on a Postgres pair (as root)
        run: |
          sudo bash ops/jepsen/test-postgres.sh "${TOP}/bin/zcube" "${TOP}/bin/zcube-server" \
            "${TOP}/bin/zcube-agent" "${TOP}/bin/zcube-jepsen-client"

  # The release workflow's build and checks (release.yml's `build` job), publishing nothing: no
  # draft, no upload, no tag, contents: read. Runs when release.yml, its scripts or actions, or
  # src/dist.zig change, and on a full run (docs/releases/automation.md). No build cache: the
  # release builds from nothing, and this job runs rarely enough not to spend the cache budget.
  release:
    name: release build (x86_64, aarch64; nothing published)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # release.yml must load its local actions and scripts from .release-tools (the workflow's
      # own commit), never from the release commit's checkout.
      - name: release.yml runs local tools only from .release-tools
        run: |
          if grep -vE '^[[:space:]]*#' .github/workflows/release.yml |
            grep -nE "(^|[[:space:]\"'(])(\./)?\.github/(actions/|release-)"; then
            echo "::error::release.yml names a local action or script outside .release-tools"
            exit 1
          fi
      # Code the release commit controls (build.zig, the build and its tests, every sudo step
      # after it) runs in jobs with no write token: a job that runs `zig build` names no
      # `contents: write`, GH_TOKEN, github.token or secret, and the workflow's default stays
      # read-only. Only `draft`, `attach` and `publish` write, and none of them builds.
      - name: release.yml builds only in jobs without a write token
        run: |
          awk '
            /^[[:space:]]*#/ { next }
            /^jobs:/ { in_jobs = 1; next }
            !in_jobs && /^  contents: write/ { print "workflow default: contents: write"; bad = 1 }
            in_jobs && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ { finish(); job = $1; build = 0; write = "" }
            in_jobs && /zig build/ { build = 1 }
            in_jobs && /contents:[[:space:]]*write|GH_TOKEN|github\.token|secrets\./ {
              write = write " " $0
            }
            function finish() {
              if (build && write != "") { print job " runs zig build and has:" write; bad = 1 }
            }
            END { finish(); exit bad }
          ' .github/workflows/release.yml || {
            echo "::error::a release.yml job that runs zig build holds a write token"
            exit 1
          }
      - name: The release scripts pass shellcheck
        run: shellcheck .github/release-*.sh
      - uses: ./.github/actions/setup-zig
        with:
          cache: 'false'
      - name: The aarch64 libraries and qemu-user
        run: |
          sudo .github/release-libs.sh "${RUNNER_TEMP}/aarch64-libs"
          echo "LIBS_AARCH64=${RUNNER_TEMP}/aarch64-libs" >> "${GITHUB_ENV}"
      - name: Build
        run: zig build release -Drelease-lib-dir-aarch64="${LIBS_AARCH64}" --summary all
      - name: Check
        run: |
          version=$(sed -n 's/^ *\.version = "\([^"]*\)",.*/\1/p' build.zig.zon | head -n 1)
          .github/release-check.sh zig-out/release "${version}" "$(git rev-parse HEAD)"
