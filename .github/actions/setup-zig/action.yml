name: Set up Zig
description: >
  Installs the Zig toolchain pinned in build.zig.zon (minimum_zig_version) from ziglang.org
  and verifies the tarball against its published SHA-256 before using it.
runs:
  using: composite
  steps:
    # The unpacked toolchain, one entry for every job. The download from ziglang.org took 1 to 2
    # minutes in every job of a run (main, 2026-11-04). The checksum is verified on the miss path
    # only, because only a verified toolchain is ever saved.
    - name: Cache the Zig toolchain
      id: toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/zig-x86_64-linux-0.17.0
        key: zig-toolchain-0.17.0-1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    - name: Install Zig 0.17.0
      if: ${{ steps.toolchain.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        ZIG_VERSION: 0.17.0
        # From https://ziglang.org/download/index.json, field 0.17.0 / x86_64-linux / shasum.
        ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
      run: |
        archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
        curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
        echo "${ZIG_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
        tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
    - name: Put the toolchain on PATH
      shell: bash
      run: echo "${RUNNER_TEMP}/zig-x86_64-linux-0.17.0" >> "${GITHUB_PATH}"
    - name: Show the toolchain
      shell: bash
      run: zig version
